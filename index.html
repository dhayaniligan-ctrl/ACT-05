<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hero Section</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="Diafy logo">
            </div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Commission</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Learn</a></li>
                <li><a href="#">About</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="#" class="btn-outline">Sign Up</a>
                <a href="#" class="btn-outline">Log In</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-text">
                <h1>
                    <span>Create.</span>
                    <span>Learn.</span>
                    <span>Commission</span>
                </h1>
                <p>Your complete hub for art services, learning, and creative collaboration.</p>
                <div class="hero-buttons">
                    <a href="#" class="btn-glass">Request Commission</a>
                    <a href="#" class="btn-glass">Start Learning</a>
                </div>
            </div>

            <div class="hero-images">
                <img class="img-lilies" src="assets/water-lilies.png" alt="Water lilies painting">
                <img class="img-mona" src="assets/mona-lisa.png" alt="Mona Lisa painting">
                <img class="img-starry" src="assets/starry-night.png" alt="Starry Night painting">
                <img class="img-umbrella" src="assets/woman-umbrella.png" alt="Woman with a parasol painting">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Diafy | All Rights Reserved</p>
        <div class="socials">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
        </div>
        
    </footer>
    
</body>
</html>
